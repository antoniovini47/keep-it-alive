# Ping interval is controlled here — edit the cron expression to change frequency.
# GitHub minimum is once every 5 minutes (e.g. "*/5 * * * *").
name: Keep services alive

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Ping all targets
        run: npm run ping
        env:
          REPO_SECRET: ${{ secrets.REPO_SECRET }}
